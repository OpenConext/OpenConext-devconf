# nginx reverse proxy for exposing the Chromium DevTools (CDP) localhost endpoint (127.0.0.1:9223) on
# 0.0.0.0:9222 in the container so port 9222 can be exposed by Docker to reach the CDP running at port 9223.

worker_processes 1;
pid /tmp/cdp-proxy-nginx.pid;
error_log /tmp/cdp-proxy-error.log;

events {
    worker_connections 128;
}

http {
    access_log off;
    default_type application/octet-stream;

    # Keep nginx temp dirs writable regardless of the worker user.
    client_body_temp_path /tmp/cdp-proxy-client-body;
    proxy_temp_path /tmp/cdp-proxy-proxy;

    # WebSocket upgrade support (CDP clients connect via WebSocket).
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 0.0.0.0:9222;

        location / {
            proxy_pass http://127.0.0.1:9223;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            # Chromium rejects DevTools requests whose Host header is not an
            # IP/localhost, so present the loopback address to Chromium
            proxy_set_header Host 127.0.0.1:9223;

            # Rewrite the debugger URLs in the /json* responses so clients
            # get a webSocketDebuggerUrl that they can actually reach.
            sub_filter '127.0.0.1:9223' 'chrome.dev.openconext.local:9222';
            sub_filter_once off;
            sub_filter_types application/json;
        }
    }
}
